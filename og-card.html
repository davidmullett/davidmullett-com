<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG card source — davidmullett.com (v4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: #f1f0ec; overflow: hidden; }
  body { position: relative; }

  /* THE LINE — first sentence of the hero, site serif, flush left at x=120 */
  .line {
    position: absolute;
    left: 120px; top: 150px;
    width: 960px;
    font-family: 'IBM Plex Serif', Georgia, serif;
    font-weight: 400;
    font-size: 54px;
    line-height: 1.28;
    letter-spacing: -0.012em;
    color: #1a1710;
    text-wrap: pretty;
  }

  /* THE NAME — small, mono, tracked like the wordmark, beneath */
  .name {
    position: absolute;
    left: 120px; bottom: 96px;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 0.17em;
    text-transform: uppercase;
    color: #1a1710;
    line-height: 1;
  }
</style>
</head>
<body>
  <p class="line">Your attention is scored every day, by machinery running underneath every screen you&nbsp;touch.</p>
  <span class="name">David Mullett</span>
</body>
</html>
