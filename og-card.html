<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG card source — davidmullett.com (v6)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: #f1f0ec; overflow: hidden; }
  body { position: relative; }

  /* THE LINE — first sentence of the headline, site serif, flush left */
  .line {
    position: absolute;
    left: 120px; top: 196px;
    width: 900px;
    font-family: 'IBM Plex Serif', Georgia, serif;
    font-weight: 400;
    font-size: 64px;
    line-height: 1.26;
    letter-spacing: -0.014em;
    color: #1a1710;
  }

  /* THE NAME — small, mono, tracked like the site wordmark */
  .name {
    position: absolute;
    left: 120px; top: 392px;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.17em;
    text-transform: uppercase;
    color: #1a1710;
    line-height: 1;
  }
</style>
</head>
<body>
  <p class="line">Every screen you touch is keeping&nbsp;score.</p>
  <span class="name">David Mullett</span>
</body>
</html>
