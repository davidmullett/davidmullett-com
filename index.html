<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --cream:#f1f0ec; --ink:#1a1710; --ink-2:#48443c;
  --rule-lt:#d8d4c8; --rule-2:#c9c4b6;
  --ph:#1faa5e; --ph-d:#157a43; --ph-border:rgba(45,214,122,.5);
  --serif:'IBM Plex Serif',Georgia,serif; --mono:'IBM Plex Mono','Courier New',monospace;
  --t-label:0.56rem; --t-meta:0.66rem; --t-aux:0.86rem; --t-label-lg:0.92rem;
}
html { font-size:18px; -webkit-text-size-adjust:100%; text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased; font-feature-settings:"liga" 1,"kern" 1,"onum" 1;
  background:var(--cream); color-scheme:only light; }
body { background:var(--cream) !important; color:var(--ink) !important; font-family:var(--serif); line-height:1.65; }

/* Left-anchor asymmetry — unchanged from the standing layout */
.page { max-width:680px; margin:0 auto 0 max(80px,14vw); padding:56px 0 132px; }

a { color:var(--ink); text-decoration:underline; text-decoration-color:var(--rule-2);
  text-underline-offset:3px; text-decoration-thickness:1px; transition:text-decoration-color .14s,color .14s; }
a:hover { text-decoration-color:var(--ink-2); }
/* family rule: green is reserved for links that point to the work */
a.lz { text-decoration-color:var(--ph-border); }
a.lz:hover { color:var(--ph-d); text-decoration-color:var(--ph-d); }

/* Mark — quiet, static, links to the work */
.mark { display:inline-block; line-height:0; margin-bottom:30px; }
.mark svg { display:block; overflow:visible; }
.mark .spiral { stroke:var(--ink); stroke-width:2; fill:none; stroke-linecap:round; }
.mark .core { fill:var(--ink); transition:fill .15s; }
.mark:hover .core { fill:var(--ph); }
@media (prefers-reduced-motion: no-preference) {
  .mark .spiral { stroke-dasharray:1; stroke-dashoffset:1; animation: draw 2.1s cubic-bezier(.6,.02,.2,1) .15s forwards; }
  .mark .core { opacity:0; animation: glow 1s ease 1.7s forwards; }
}
@keyframes draw { to { stroke-dashoffset:0; } }
@keyframes glow { to { opacity:1; } }

header { margin-bottom:54px; }
/* the wordmark is the only tracked-out element */
.wordmark { font-family:var(--mono); font-size:var(--t-label-lg); font-weight:400; letter-spacing:0.17em;
  text-transform:uppercase; color:var(--ink); margin-bottom:22px; }
.header-meta { font-family:var(--mono); font-size:var(--t-label); font-weight:300; color:var(--ink-2);
  letter-spacing:0.05em; line-height:1.9; display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 18px; }
.header-meta a { font-family:var(--mono); font-size:var(--t-label); color:var(--ink-2); text-decoration:none; letter-spacing:0.05em; }
.header-meta a:hover { color:var(--ink); }

section { margin-bottom:52px; }
h2 { font-family:var(--mono); font-size:var(--t-label); font-weight:400; letter-spacing:0.1em;
  text-transform:uppercase; color:var(--ink-2); margin-bottom:24px; margin-left:-80px;
  width:calc(100% + 80px); line-height:1.4; }

/* Ledger — shared component (title / meta / note) */
.ledger { list-style:none; max-width:54ch; border-top:1px solid var(--rule-lt); }
.ledger li { display:flex; flex-direction:column; padding:12px 0; border-bottom:1px solid var(--rule-lt); gap:3px; }
.l-primary { font-size:var(--t-aux); line-height:1.45; color:var(--ink); }
.l-secondary { font-size:var(--t-label); font-family:var(--mono); font-weight:300; color:var(--ink-2); letter-spacing:0.04em; }
.l-note { font-size:var(--t-aux); line-height:1.55; color:var(--ink-2); max-width:50ch; margin-top:2px; }
.l-note a, .l-secondary a { font-family:var(--mono); font-size:var(--t-label); letter-spacing:0.04em; color:var(--ink-2); }
.l-note a:hover, .l-secondary a:hover { color:var(--ink); }
.l-secondary a.lz:hover { color:var(--ph-d); }
cite { font-style:italic; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

/* hairline field separators between inline meta items, centered in the gap; dropped when stacked */
.header-meta > * + * { position:relative; }
.header-meta > * + *::before { content:""; position:absolute; left:-9px; top:50%; transform:translateY(-50%); height:0.85em; border-left:1px solid var(--rule-2); }

@media (max-width:760px){ html{font-size:17px;} .page{margin:0 auto 0 max(28px,6vw);padding:46px 32px 96px;} h2{margin-left:-32px;width:calc(100% + 32px);} }
@media (max-width:460px){ html{font-size:16px;} .page{padding:34px 20px 80px;} h2{margin-left:-20px;width:calc(100% + 20px);} .header-meta{flex-direction:column;} .header-meta > * + *::before{display:none;} }
</style>
