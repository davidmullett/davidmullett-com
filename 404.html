<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#f1f0ec">
<title>Not found — David Mullett</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --cream:#f1f0ec; --ink:#1a1710; --ink-2:#48443c; --rule-lt:#d8d4c8;
    --serif:'IBM Plex Serif',Georgia,serif; --mono:'IBM Plex Mono','Courier New',monospace;
  }
  html { font-size:18px; -webkit-text-size-adjust:100%; text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased; background:var(--cream); color-scheme:only light; }
  body { background:var(--cream); color:var(--ink); font-family:var(--serif); line-height:1.65;
    min-height:100vh; display:flex; align-items:center; }
  main { width:100%; max-width:34rem; margin:0 auto; padding:48px 20px; }
  .mark { display:inline-block; line-height:0; margin-bottom:26px; }
  .mark svg { display:block; overflow:visible; }
  .mark .spiral { stroke:var(--ink); stroke-width:2; fill:none; stroke-linecap:round; }
  .mark .core { fill:var(--ink); }
  .code { font-family:var(--mono); font-size:0.56rem; font-weight:400; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--ink-2); margin-bottom:14px; }
  h1 { font-family:var(--serif); font-size:1.6rem; font-weight:400; line-height:1.34;
    letter-spacing:-0.012em; margin-bottom:18px; }
  p { color:var(--ink-2); font-size:1rem; margin-bottom:26px; max-width:30rem; }
  a.home { font-family:var(--mono); font-size:0.66rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--ink); text-decoration:none; border-bottom:1px solid var(--rule-lt); padding-bottom:3px; }
  a.home:hover { border-bottom-color:var(--ink); }
  a.home:focus-visible { outline:2px solid var(--ink); outline-offset:4px; }
</style>
</head>
<body>
<main>
  <span class="mark">
    <svg width="40" height="40" viewBox="-8 -8 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loopzero mark">
      <path class="spiral" pathLength="1" d="M40.15,41.3 Q40,40.65 40,40 Q40,8 66,14 Q82,25 80,48 Q74,69 50,74 Q23,78 9,56 Q-4,34 8,14 Q20,-4 42,2 Q66,8 76,30 Q84,54 70,68 Q54,82 34,80 Q14,78 6,62 Q-2,46 8,34 Q18,22 34,20 Q52,18 60,34 Q68,50 58,62 Q48,74 36,70 Q24,66 22,54 Q20,44 28,38 Q36,32 44,36 Q52,40 50,48 Q48,56 42,54 Q38,52 38,48 Q38,44 41,42"/>
      <circle class="core" cx="41" cy="42" r="2"/>
    </svg>
  </span>
  <div class="code">404 — Not found</div>
  <h1>There is nothing at this address.</h1>
  <p>The page was either never here, or has been withdrawn.</p>
  <a class="home" href="/">David Mullett</a>
</main>
</body>
</html>
